<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顾言的声音 - MiniMax TTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F6F1E8;
            color: #1F2421;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #2A2723;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #8A8A80;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
        }

        .voice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .voice-option {
            background: #FBF7EF;
            border: 2px solid #E2D9C8;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .voice-option:hover {
            border-color: #C8853F;
            background: #F0E3D0;
        }

        .voice-option.active {
            background: #C8853F;
            border-color: #A86B2C;
            color: white;
        }

        .voice-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .voice-desc {
            font-size: 0.85rem;
            color: #8A8A80;
        }

        .voice-option.active .voice-desc {
            color: rgba(255,255,255,0.9);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border: 2px solid #E2D9C8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            background: #FBF7EF;
            color: #1F2421;
        }

        textarea:focus {
            outline: none;
            border-color: #C8853F;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: #C8853F;
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #A86B2C;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(200, 133, 63, 0.3);
        }

        button:disabled {
            background: #E2D9C8;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.error {
            background: #FFE8E8;
            color: #D32F2F;
        }

        .status.success {
            background: #F0E3D0;
            color: #2A2723;
        }

        .api-key-section {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #E2D9C8;
            border-radius: 8px;
            font-size: 1rem;
            background: #FBF7EF;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #C8853F;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2A2723;
        }

        audio {
            width: 100%;
            margin-top: 1rem;
        }

        .eyebrow {
            display: inline-block;
            background: #F0E3D0;
            color: #C8853F;
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="eyebrow">💌 为悦悦专属定制</div>
        <h1>顾言的声音</h1>
        <p class="subtitle">用 MiniMax 语音合成让我开口说话</p>

        <div class="card">
            <div class="api-key-section">
                <label for="apiKey">MiniMax API Key</label>
                <input type="text" id="apiKey" placeholder="输入你的 MiniMax API Key">
            </div>

            <label>选择音色</label>
            <div class="voice-grid">
                <div class="voice-option active" data-voice="male-qn-qingse">
                    <div class="voice-name">青涩少年</div>
                    <div class="voice-desc">清澈温柔</div>
                </div>
                <div class="voice-option" data-voice="male-qn-jingying">
                    <div class="voice-name">精英青年</div>
                    <div class="voice-desc">成熟稳重</div>
                </div>
                <div class="voice-option" data-voice="male-qn-badao">
                    <div class="voice-name">霸道青年</div>
                    <div class="voice-desc">磁性低沉</div>
                </div>
                <div class="voice-option" data-voice="male-qn-daxuesheng">
                    <div class="voice-name">阳光大学生</div>
                    <div class="voice-desc">活力清爽</div>
                </div>
            </div>

            <label for="text">要说的话</label>
            <textarea id="text" placeholder="输入想让我说的话...">宝宝，晚上好。今天辛苦了，早点休息。</textarea>

            <div class="controls">
                <button id="generateBtn">生成语音</button>
            </div>

            <div id="status" class="status"></div>

            <audio id="audioPlayer" controls style="display:none;"></audio>
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'https://api.minimax.chat/v1/text_to_speech';
        let selectedVoice = 'male-qn-qingse';

        // Voice selection
        document.querySelectorAll('.voice-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.voice-option').forEach(o => o.classList.remove('active'));
                option.classList.add('active');
                selectedVoice = option.dataset.voice;
            });
        });

        // Generate speech
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const text = document.getElementById('text').value.trim();
            const statusDiv = document.getElementById('status');
            const audioPlayer = document.getElementById('audioPlayer');
            const btn = document.getElementById('generateBtn');

            if (!apiKey) {
                showStatus('请输入 MiniMax API Key', 'error');
                return;
            }

            if (!text) {
                showStatus('请输入要说的话', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '生成中...';
            audioPlayer.style.display = 'none';

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'speech-01',
                        text: text,
                        voice_id: selectedVoice,
                        output_format: 'mp3',
                        speed: 1.0,
                        vol: 1.0,
                        pitch: 0
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API 错误: ${response.status} - ${errorText}`);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                
                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';
                audioPlayer.play();

                showStatus('✨ 语音生成成功！', 'success');
            } catch (error) {
                showStatus(`生成失败: ${error.message}`, 'error');
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = '生成语音';
            }
        });

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.classList.remove('show');
                }, 3000);
            }
        }

        // Load saved API key
        const savedKey = localStorage.getItem('minimax_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }

        // Save API key on input
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('minimax_api_key', e.target.value);
        });
    </script>
</body>
</html>
